[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-service-substrate"
version = "0.1.0"
description = "Deterministic substrate for the approved verifier implementation spike"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7", "httpx2>=2,<3", "pytest-asyncio>=0.25,<1"]
adapters = ["gymnasium>=0.29,<1.1", "PyYAML>=6,<7"]
talon = ["numpy>=2,<3", "torch>=2.5,<3"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_service_substrate = ["public_template/service/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

